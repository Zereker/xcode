name: Package xcode
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "stable, latest, or exact Claude Code version"
        default: stable
        type: string
      force:
        description: "Re-run verification even if this release exists"
        default: false
        type: boolean
  push:
    branches: [main]
    paths: ["packaging/**", ".github/workflows/package-xcode.yml"]
permissions:
  contents: read
concurrency:
  group: xcode-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TARGET: ${{ inputs.target || 'stable' }}
      FORCE: ${{ inputs.force || 'false' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s packaging -p 'test_*.py' -v
      - name: Resolve upstream and check existing release
        id: version
        run: |
          set -euo pipefail
          version=$(python3 packaging/package.py resolve --target "$TARGET")
          tag="xcode-v${version}-r1"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          TAG="$tag" python3 - <<'PY'
          import json, os
          from pathlib import Path
          # gh --paginate emits multiple arrays, so decode each page.
          text = Path(os.environ["RUNNER_TEMP"], "releases.json").read_text()
          decoder = json.JSONDecoder()
          releases = []
          while text.strip():
              page, end = decoder.raw_decode(text.lstrip())
              releases.extend(page)
              text = text.lstrip()[end:]
          matches = [r for r in releases if r["tag_name"] == os.environ["TAG"] and not r["draft"]]
          required = {"xcode-darwin-arm64.tar.gz", "metadata.json", "SHA256SUMS", "manifest.json", "manifest.json.sig"}
          complete = bool(matches) and required.issubset({a["name"] for a in matches[0]["assets"]})
          skip = complete and os.environ["FORCE"] != "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=" + str(skip).lower() + "\n")
          print("Already packaged; skipping." if skip else "Packaging required.")
          PY
      - name: Install manifest verification tool
        if: steps.version.outputs.skip != 'true'
        run: command -v gpg >/dev/null || brew install gnupg
      - name: Verify, sign and smoke-test binary
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 packaging/package.py build --target "$VERSION"
      - name: Publish verified release
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Existing published assets are immutable; force only repeats validation.
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/is-draft"; then
            if [ "$(cat "$RUNNER_TEMP/is-draft")" = false ]; then
              echo "Release already exists; refusing to overwrite published binaries."
              exit 0
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "xcode $VERSION (macOS arm64)" --notes-file packaging/RELEASE-NOTES.md
          fi
          gh release upload "$TAG" dist/* --clobber
          if [ "$TARGET" = stable ]; then
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          else
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          fi
      - name: Promote an existing verified prerelease when stable catches up
        if: success() && env.TARGET == 'stable'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --prerelease=false --latest
      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          printf 'Release: https://github.com/%s/releases/tag/%s\n' "$GH_REPO" "$TAG" >> "$GITHUB_STEP_SUMMARY"
